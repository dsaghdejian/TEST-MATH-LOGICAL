<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent}</style></head><body><script>
(function(){
  let lastState = document.visibilityState === 'hidden' ? 'hidden' : 'visible';
  function send(type){
    const value={event:type,at:new Date().toISOString()};
    window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:value},'*');
  }
  window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
  window.addEventListener('message',function(e){
    if(e.data && e.data.type==='streamlit:render'){
      window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:1},'*');
    }
  });
  document.addEventListener('visibilitychange',function(){
    const next=document.visibilityState==='hidden'?'hidden':'visible';
    if(next!==lastState){lastState=next;send(next==='hidden'?'left':'returned');}
  });
  // Best effort: attempt to bind restrictions to the host page when browser sandbox permits it.
  function block(e){e.preventDefault();e.stopPropagation();return false;}
  try{
    const d=window.parent.document;
    ['copy','cut','paste','contextmenu'].forEach(name=>d.addEventListener(name,block,true));
    d.addEventListener('keydown',function(e){
      const key=(e.key||'').toLowerCase();
      if((e.ctrlKey||e.metaKey)&&['c','v','x','a'].includes(key)) block(e);
      if(e.shiftKey&&e.key==='Insert') block(e);
    },true);
    d.addEventListener('dragstart',block,true);
  }catch(err){}
  // Also block interactions inside the monitor frame itself.
  ['copy','cut','paste','contextmenu','dragstart'].forEach(name=>document.addEventListener(name,block,true));
})();
</script></body></html>
